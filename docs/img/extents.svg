  <text x="40" y="262" font-size="10.5" fill="#57606a">The small read's gap grows to 64 KiB and lands within 64 KiB of the large read's last gap, so the two share one request.</text>
  <text x="40" y="282" font-size="10.5" fill="#57606a">Everything fetched stays cached, in pieces of at most 1 MiB, until 256 MiB of newer bytes push it out</text>
