  <text x="40" y="30" font-size="13" fill="#24292f">Two reads issued in one turn</text>
  <text x="40" y="49" font-size="10.5" fill="#57606a">One extent is cached and another read has one in flight, so only the 4 gaps are fetched. Gaps within 64 KiB of each other share a request: 3 go out.</text>
